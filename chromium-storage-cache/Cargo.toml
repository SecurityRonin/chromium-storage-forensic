[package]
name = "chromium-storage-cache"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chromium Simple Cache reader — backward-compatible facade that re-exports chromium-storage-cache-core (the reader was split into a -core reader + a -forensic analyzer). New consumers should depend on chromium-storage-cache-core directly."
