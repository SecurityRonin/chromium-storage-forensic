[workspace]
resolver = "2"
members = [
    # Every parser is a reader (-core) + a backward-compat facade + an analyzer
    # (-forensic): the read/analyze split ADR-0008 mandates, per format.
    "chromium-storage-cache-core",
    "chromium-storage-cache",
    "chromium-storage-cache-forensic",
    "chromium-storage-indexeddb-core",
    "chromium-storage-indexeddb",
    "chromium-storage-indexeddb-forensic",
    "chromium-storage-localstorage-core",
    "chromium-storage-localstorage",
    "chromium-storage-localstorage-forensic",
]

# Single source of truth for fields shared by every member (DRY): bump version /
# edition / license here once; members inherit via `field.workspace = true`.
[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/SecurityRonin/chromium-storage-forensic"
authors = ["Albert Hui <albert@securityronin.com>"]

[workspace.dependencies]
# Fleet crates: published on crates.io — registry versions (honest carets, no path).
forensicnomicon-core = "1.5"
# The normalized report model — the -forensic analyzers emit findings through it.
forensicnomicon = "1"
# Per-format reader/analyzer members.
chromium-storage-cache-core = { version = "0.2.0", path = "chromium-storage-cache-core" }
chromium-storage-indexeddb-core = { version = "0.2.0", path = "chromium-storage-indexeddb-core" }
chromium-storage-localstorage-core = { version = "0.2.0", path = "chromium-storage-localstorage-core" }
# Integrity recomputation for the analyzers (self-validating findings).
crc32fast = "1"
sha2 = "0.10"
# Panic-free bounded integer readers over untrusted bytes (the shared front door).
safe-read = "0.2"
# Raw, read-only LevelDB record reader (surfaces tombstones + sequence numbers).
leveldb-core = "0.1"
# V8 / Blink structured-clone value deserializer (IndexedDB record values).
# `default-features = false` drops the CLI (clap) — the lean library build.
blob-decoder = { version = "0.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all                      = { level = "warn", priority = -1 }
pedantic                 = { level = "warn", priority = -1 }
correctness              = { level = "deny", priority = -1 }
suspicious               = { level = "deny", priority = -1 }
unwrap_used              = { level = "deny", priority = 0 }
expect_used              = { level = "deny", priority = 0 }
module_name_repetitions  = { level = "allow", priority = 1 }
must_use_candidate       = { level = "allow", priority = 1 }
missing_errors_doc        = { level = "allow", priority = 1 }
missing_panics_doc        = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap       = { level = "allow", priority = 1 }
cast_sign_loss           = { level = "allow", priority = 1 }
cast_precision_loss      = { level = "allow", priority = 1 }
too_many_lines           = { level = "allow", priority = 1 }
items_after_statements   = { level = "allow", priority = 1 }
similar_names            = { level = "allow", priority = 1 }
manual_let_else          = { level = "allow", priority = 1 }
